[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[lint]
lint_on_build = false
